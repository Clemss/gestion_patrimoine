<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne de lecture (max 920px) — en-tête de valeur façon terminal boursier,
   graphique pleine largeur, puis lignes d'actifs denses et alignées. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --ink: #15181e;
  --muted: #5b6270;
  --faint: #8b92a0;
  --line: #e1e4ea;
  --accent: #3a3fae;
  --accent-ink: #ffffff;
  --up: #0d7a3c;
  --up-soft: rgba(13,122,60,.10);
  --down: #c2302c;
  --down-soft: rgba(194,48,44,.10);
  --shadow: 0 1px 2px rgba(20,24,40,.05), 0 8px 24px rgba(20,24,40,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --surface: #171a21; --sunken: #1d2129; --ink: #e9ebf0; --muted: #a0a7b5; --faint: #6f7685;
    --line: #2a2f39; --accent: #9296ff; --accent-ink: #11132a; --up: #3ccf7c; --up-soft: rgba(60,207,124,.13);
    --down: #ff6f68; --down-soft: rgba(255,111,104,.13); --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --surface: #171a21; --sunken: #1d2129; --ink: #e9ebf0; --muted: #a0a7b5; --faint: #6f7685;
  --line: #2a2f39; --accent: #9296ff; --accent-ink: #11132a; --up: #3ccf7c; --up-soft: rgba(60,207,124,.13);
  --down: #ff6f68; --down-soft: rgba(255,111,104,.13); --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
.wrap {
  max-width: 920px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barre du haut */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand svg { color: var(--accent); }
.status { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.status.err { color: var(--down); }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px;
  font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--down); }
.btn.danger.armed { background: var(--down); color: #fff; border-color: var(--down); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--faint); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bandeau exemple */
.banner { background: var(--sunken); border-bottom: 1px solid var(--line); font-size: 14px; }
.banner .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; }
.banner p { margin: 0; flex: 1 1 260px; color: var(--muted); }
.banner strong { color: var(--ink); }

main.wrap { padding-block: 22px 60px; display: flex; flex-direction: column; gap: 28px; }

/* En-tête de valeur */
.hero { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.big { font: 700 clamp(34px, 7vw, 48px)/1.1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ath { align-self: flex-start; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-top: 4px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--sunken); font-size: 12.5px; max-width: 100%; }
.ath-k { font-weight: 700; font-size: 10.5px; letter-spacing: .06em; padding: 1px 6px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.ath-v { font-weight: 700; }
.ath-d { color: var(--muted); }
.ath.top { background: var(--up-soft); }
.ath.top .ath-k { background: var(--up); color: var(--bg); }
.ath.top .ath-d { color: var(--up); font-weight: 600; }
.heads { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 0 -12px; }
.head { flex: 1 1 260px; min-width: 0; text-align: left; background: none; border: 1px solid transparent; border-radius: 14px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; color: inherit; }
.head:hover { background: var(--sunken); }
.head.on { border-color: var(--line); background: var(--surface); box-shadow: var(--shadow); }
.head:not(.on) .big { font-size: clamp(26px, 5vw, 34px); }
.chg { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.chg .when { color: var(--muted); font-weight: 500; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 6px; font-weight: 600; }
.pill.up { background: var(--up-soft); } .pill.down { background: var(--down-soft); }

.ranges { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ranges button { background: none; border: 0; padding: 8px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ranges button:hover { color: var(--ink); }
.ranges button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.chart { position: relative; height: 280px; margin-top: 8px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .tick { font-size: 11px; fill: var(--faint); }
.chart-empty { height: 100%; display: grid; place-items: center; color: var(--faint); font-size: 14px; text-align: center; padding: 0 20px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; white-space: nowrap; transform: translateX(-50%); }
.tip b { display: block; font-size: 13.5px; }
.tip span { color: var(--muted); }

.seg { display: inline-flex; flex-wrap: wrap; background: var(--sunken); border-radius: 18px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Chiffres clés */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stat { padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 12.5px; font-weight: 600; }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.stats.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats.six .stat:nth-child(4) { border-left: 0; }
.stats.six .stat:nth-child(n+4) { border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  .stats.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats.six .stat { border-left: 1px solid var(--line); border-top: 0; }
  .stats.six .stat:nth-child(odd) { border-left: 0; }
  .stats.six .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* Répartition */
h2 { font: 700 18px/1.2 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-head .sum { color: var(--muted); font-weight: 600; font-size: 14px; }
.alloc-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--sunken); }
.alloc-bar span { display: block; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13.5px; }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { font-weight: 600; }
.legend span { color: var(--muted); }

/* Lignes d'actifs */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 130px 96px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.row:first-child { border-top: 0; }
.row.subrow { padding-left: 32px; padding-block: 8px; background: var(--sunken); border-top-style: dashed; }
.row.subrow .name { font-weight: 500; font-size: 14px; }
.row.subrow .val { font-weight: 600; font-size: 14px; color: var(--muted); }
.row.subrow:hover { background: var(--line); }
.row:hover { background: var(--sunken); }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .val { text-align: right; font-weight: 700; }
.row .qty { text-align: right; font-size: 12.5px; color: var(--muted); }
.row .delta { justify-self: end; font-size: 13px; }
.row svg { display: block; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 0 5px; border-radius: 4px; background: var(--sunken); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .spark { display: none; }
  .row .valbox { grid-column: 2; grid-row: 1; }
  .row .delta { grid-column: 1; grid-row: 2; justify-self: start; margin-top: -2px; }
  .row .valbox { grid-row: 1 / span 2; align-self: center; }
}
.empty { padding: 22px 16px; color: var(--muted); font-size: 14px; }
.cat-group { display: flex; flex-direction: column; gap: 6px; }
.cat-head { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cat-head span:last-child { letter-spacing: 0; text-transform: none; font-size: 13px; }

/* Vue actif */
.back { align-self: flex-start; margin-left: -10px; }
.asset-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.asset-head h1 { font: 700 26px/1.15 var(--f-display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.asset-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.asset-head .tools { display: flex; gap: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.kind { font-weight: 600; }
.kind.buy { color: var(--up); } .kind.sell { color: var(--down); }
.del { border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.del:hover { color: var(--down); background: var(--down-soft); }
.del.armed { color: #fff; background: var(--down); }

/* Formulaires */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=url], input[type=search], select {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); font-weight: 500; }
.hint { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
.hint.err { color: var(--down); }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.form-actions .hint { margin-right: auto; }

/* Fenêtres */
dialog { border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,12,20,.45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 40px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; gap: 12px; }
.dlg-head h2 { font-size: 20px; }
.dlg-body { padding: 10px 18px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.results { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-height: 240px; overflow-y: auto; }
.results button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
.results button:first-child { border-top: 0; }
.results button:hover, .results button:focus-visible { background: var(--sunken); }
.results .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .x { font-size: 12.5px; color: var(--muted); }
.chosen { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sunken); }
.chosen b { font-weight: 700; }
.chosen .x { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { font-size: 13.5px; color: var(--muted); background: var(--sunken); border-radius: 10px; padding: 10px 12px; margin: 0; }
.note code { font-size: 12.5px; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.setting h3 { margin: 0 0 6px; font-size: 15px; }
.setting p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 100; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

@media (prefers-reduced-motion: no-preference) {
  .row, .btn, .ranges button { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand" id="brand" role="link" tabindex="0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 17l5-5 4 3 8-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Patrimoine
    </div>
    <span class="status" id="status"></span>
    <button class="btn primary" id="btn-add" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Ajouter
    </button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Réglages">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </div>
</header>

<div class="banner" id="banner" hidden>
  <div class="wrap">
    <p><strong>Données d'exemple.</strong> Les montants et cours affichés sont fictifs, pour te montrer l'appli. Efface-les quand tu veux pour saisir ton vrai patrimoine.</p>
    <button class="btn" id="btn-clear-demo" type="button">Effacer les exemples</button>
  </div>
</div>

<main class="wrap" id="app"></main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================= Utilitaires ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => isoLocal(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const toUnix = s => Date.parse(s + "T00:00:00Z") / 1000;

function repairIds() {
  let fixed = false;
  const seen = new Set();
  for (const a of S.assets) {
    if (!a.id || a.id === "undefined" || seen.has(a.id)) {
      const old = a.id, nid = uid();
      // un crédit relié à l'ancien identifiant en double reste relié au premier bien ; un identifiant vide n'a pas de crédit
      a.id = nid; fixed = true; void old;

    seen.add(a.id);
    // réglages d'un autre type copiés par erreur (ex. un prêt sur un placement coté)
    if (a.kind !== "dette") for (const k of ["loan", "linkedTo"]) if (k in a) { delete a[k]; fixed = true; }
    if (a.kind !== "bien") for (const k of ["purchase", "share", "growth"]) if (k in a) { delete a[k]; fixed = true; }
    a.txs = Array.isArray(a.txs) ? a.txs : []; a.vals = Array.isArray(a.vals) ? a.vals : [];

    for (const x of [...a.txs, ...a.vals]) { if (!x.id || sub.has(x.id)) { x.id = uid(); fixed = true; } sub.add(x.id); }
  }

}

async function fetchChart(symbol, from) {
  const j = await api(`/chart?symbol=${encodeURIComponent(symbol)}&from=${toUnix(from)}&to=${Math.floor(Date.now() / 1000) + 86400}`);
  const res = j?.chart?.result?.[0];
  if (j && j.service) throw new Error("Adresse du relais incorrecte : vérifie-la dans les réglages");
  if (!res) throw new Error(j?.chart?.error?.description || "Symbole introuvable : " + symbol);
  const off = res.meta.gmtoffset || 0;
  let cur = res.meta.currency || "EUR", mult = 1;
  if (cur === "GBp" || cur === "GBX") { cur = "GBP"; mult = .01; }
  if (cur === "ZAc") { cur = "ZAR"; mult = .01; }
  if (cur === "ILA") { cur = "ILS"; mult = .01; }
  const ts = res.timestamp || [], cl = res.indicators?.quote?.[0]?.close || [];
  const d = [], c = [];
  for (let i = 0; i < ts.length; i++) {
    if (cl[i] == null) continue;
    const ds = new Date((ts[i] + off) * 1000).toISOString().slice(0, 10);
    if (d.length && d[d.length - 1] === ds) c[c.length - 1] = cl[i] * mult;
    else if (!d.length || ds > d[d.length - 1]) { d.push(ds); c.push(cl[i] * mult); }
  }
  const rmp = res.meta.regularMarketPrice, rmt = res.meta.regularMarketTime;
  if (rmp && rmt) {
    const ds = new Date((rmt + off) * 1000).toISOString().slice(0, 10);
    if (!d.length || ds > d[d.length - 1]) { d.push(ds); c.push(rmp * mult); }
    else if (ds === d[d.length - 1]) c[c.length - 1] = rmp * mult;
  }
  return { cur, d, c, at: Date.now(), name: res.meta.longName || res.meta.shortName || symbol, type: res.meta.instrumentType || "" };
}
const fxSym = cur => cur + "EUR=X";
function getSeries(symbol) { return symbol?.startsWith("EX:") ? demoSeries(symbol) : P[symbol]; }
const inflight = {};
async function ensure(symbol, from, force = false) {
  if (!symbol) return null;
  if (symbol.startsWith("EX:")) return demoSeries(symbol);
  const c = P[symbol];
  const fresh = c && c.from <= from && Date.now() - c.at < 30 * 60e3;
  if (fresh && !force) { if (c.cur !== "EUR") await ensure(fxSym(c.cur), c.from); return c; }
  const key = symbol;
  if (inflight[key]) { await inflight[key].catch(() => {}); if (P[symbol] && P[symbol].from <= from) return P[symbol]; }
  const job = (async () => {
    const f = c && c.from < from ? c.from : from;
    try {
      const s = await fetchChart(symbol, addDays(f, -10));
      s.from = f; P[symbol] = s; saveP();
      if (s.cur !== "EUR") await ensure(fxSym(s.cur), f);
      return s;
    } catch (e) { if (c) return c; throw e; }
  })();
  inflight[key] = job;
  try { return await job; } finally { if (inflight[key] === job) delete inflight[key]; }
}
function lookup(s, date) {

  let lo = 0, hi = s.d.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (s.d[m] <= date) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans >= 0 ? s.c[ans] : null;
}

/* ================= Synchronisation entre appareils ================= */
function byId(arr) { const m = new Map(); for (const x of arr || []) m.set(x.id, x); return m; }
function mergeList(l, r, del) { const m = byId(r); for (const x of l || []) m.set(x.id, x); return [...m.values()].filter(x => !del.has(x.id)); }
// fusionne les données locales (prioritaires) avec celles du cloud, sans perdre d'ajout ni ressusciter de suppression
function mergeData(local, remote) {
  remote = remote || { assets: [] };
  const del = new Set([...(remote.deleted || []), ...(local.deleted || [])]);
  const L = byId(local.assets), R = byId(remote.assets), out = [];
  for (const id of new Set([...R.keys(), ...L.keys()])) {
    if (del.has(id)) continue;
    const l = L.get(id), r = R.get(id);
    if (!l || !r) { out.push(l || r); continue; }
    out.push({ ...r, ...l, txs: mergeList(l.txs, r.txs, del), vals: mergeList(l.vals, r.vals, del) });
  }
  return { assets: out, deleted: [...del].slice(-2000) };
}

let syncing = false, syncAgain = false, pushT = null, SYNC_MSG = "", SYNC_ERR = false;
function setSync(msg, err) { SYNC_MSG = msg; SYNC_ERR = !!err; paintStatus(); }
function schedulePush() {

  clearTimeout(pushT); setSync("Enregistrement…");
  pushT = setTimeout(sync, 1200);
}
function adopt(remote) {
  S.assets = remote.data?.assets || []; S.deleted = remote.data?.deleted || []; S.rev = remote.rev | 0; S.dirty = false;
}
async function pushNow(tries = 0) {
  const p = await dataApi("PUT", { data: { assets: S.assets, deleted: S.deleted }, baseRev: S.rev });
  if (p.status === 200) { S.rev = p.j.rev; S.dirty = false; persist(); return; }
  if (p.status === 409 && tries < 3) { const m = mergeData(S, p.j.data); S.assets = m.assets; S.deleted = m.deleted; S.rev = p.j.rev; persist(); return pushNow(tries + 1); }
  if (p.status === 401) { authFailed(); throw new Error("auth"); }

}
async function sync() {
  if (!TOKEN) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  const before = JSON.stringify(S.assets);
  try {
    const g = await dataApi("GET");
    if (g.status === 401) { authFailed(); return; }
    if (g.status !== 200) throw new Error(g.j?.error || "Erreur " + g.status);
    const remote = g.j;
    if (S.dirty) {
      if (remote.rev !== S.rev) { const m = mergeData(S, remote.data); S.assets = m.assets; S.deleted = m.deleted; S.rev = remote.rev; }
      await pushNow();
    } else if (remote.rev !== S.rev) {
      adopt(remote); persist();
    }
    setSync("Synchronisé · " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
    if (JSON.stringify(S.assets) !== before) { CALC = null; render(); updateBanner(); refreshPrices(); }
  } catch (e) {
    if (e.message !== "auth") setSync(e.offline ? "Hors ligne · modifs gardées sur l'appareil" : "Synchro : " + e.message, true);
  } finally {
    syncing = false;

}

let CALC = null;
function firstDate(a) {
  if (a.kind === "dette" && a.loan && a.loan.start) return loanFrom(a.loan);
  const ds =(a.kind === "cote" ? a.txs : a.vals).map(x => x.date).sort();
  return ds[0] || null;
}
function compute() {
  if (CALC) return CALC;
  const t = today();
  let start = t;
  for (const a of S.assets) { const f = firstDate(a); if (f && f < start) start = f; }
  const n = daysBetween(start, t) + 1;
  const dates = new Array(n);
  for (let i = 0; i < n; i++) dates[i] = addDays(start, i);
  const per = {};
  const total = new Float64Array(n), assets = new Float64Array(n), debts = new Float64Array(n);
  for (const a of S.assets) {
    const r = a.kind === "cote" ? quotedDaily(a, dates) : manualDaily(a, dates);
    const f = shareOf(a);
    if (f !== 1) for (let i = 0; i < n; i++) r.val[i] *= f;
    per[a.id] = r;
    for (let i = 0; i < n; i++) {
      total[i] += r.val[i];
      if (r.val[i] >= 0) assets[i] += r.val[i]; else debts[i] += r.val[i];
    }
  }
  return CALC = { dates, total, assets, debts, per, start };
}
function quotedDaily(a, dates) {
  const n = dates.length;
  const tx = [...a.txs].sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  const s = getSeries(a.symbol);
  const cur = s?.cur || a.currency || "EUR";
  const fx = cur === "EUR" ? null : getSeries(fxSym(cur));
  const val = new Float64Array(n), px = new Array(n).fill(null), qtyArr = new Float64Array(n);
  let qi = 0, qty = 0, pi = -1, fi = -1, txPx = null;
  for (let i = 0; i < n; i++) {

    if (s) while (pi + 1 < s.d.length && s.d[pi + 1] <= d) pi++;
    if (fx) while (fi + 1 < fx.d.length && fx.d[fi + 1] <= d) fi++;
    const p = s && pi >= 0 ? s.c[pi] : txPx;
    const f = cur === "EUR" ? 1 : fx && fx.d.length ? fx.c[Math.max(fi, 0)] : 1;
    if (Math.abs(qty) < 1e-12) qty = 0;
    qtyArr[i] = qty;
    px[i] = p != null ? p * f : null;

}
function manualDaily(a, dates) {

    return { val, px: null, qty: null };

function armDeletes(root, onConfirm) {
  $$("[data-del]", root).forEach(b => b.onclick = () => {
    if (b.classList.contains("armed")) return onConfirm(b.dataset.del);
    $$(".del.armed", root).forEach(x => { x.classList.remove("armed"); x.textContent = "Supprimer"; });
    b.classList.add("armed"); b.textContent = "Confirmer";
    setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Supprimer"; } }, 4000);
  });
}

/* Prix automatique à la date choisie */
function bindAutoPrice(symbolOrFn, dateEl, priceEl, hintEl, curFn) {
  let touched = false, seq = 0;
  priceEl.addEventListener("input", () => { touched = priceEl.value !== ""; });
  const run = async () => {
    const symbol = typeof symbolOrFn === "function" ? symbolOrFn() : symbolOrFn;
    const date = dateEl.value;
    if (!symbol || !date) return;
    const my = ++seq;
    hintEl.className = "hint"; hintEl.textContent = "Recherche du cours…";
    try {
      const s = await ensure(symbol, date);
      if (my !== seq) return;
      const px = lookup(s, date), d = lookupDate(s, date);
      if (px == null) { hintEl.textContent = "Pas de cours connu à cette date : saisis le prix."; return; }
      if (!touched) priceEl.value = +px.toPrecision(10);
      const c = s.cur || (curFn && curFn()) || "EUR";
      hintEl.textContent = (d === date ? "Clôture du " : "Dernière clôture connue, le ") + fmtDate(d) + " : " + money(px, c) + (touched ? " (ton prix est conservé)" : "");
    } catch (e) {
      if (my !== seq) return;
      hintEl.className = "hint err"; hintEl.textContent = e.message + " — saisis le prix à la main.";
    }
  };
  dateEl.addEventListener("change", run);
  run();
  return run;
}

function readLoan(d, pfx = "ln") {
  const v = id => $(`#${pfx}-${id}`, d)?.value;
  const amount = parseFloat(v("amount")), rate = parseFloat(v("rate")) || 0;
  const months = Math.round((parseFloat(v("years")) || 0) * 12), start = v("start"), insurance = parseFloat(v("ins")) || 0;
  const deferral = Math.max(0, Math.round(parseFloat(v("def")) || 0));
  if (!(amount > 0 && months > 0 && start)) return null;
  const L = { amount, rate, months, start, insurance };
  if (deferral) L.deferral = Math.min(deferral, months - 1);
  const p1 = parseFloat(v("p1")), p1m = Math.round(parseFloat(v("p1m")) || 0);
  if (p1 > 0 && p1m > 0) L.steps = [{ payment: p1, months: p1m }];
  return L;
}
function bindLoanPreview(d, pfx = "ln") {
  const h = $(`#${pfx}-hint`, d);
  const run = () => {
    const L = readLoan(d, pfx); if (!L) return;
    const rows = loanRows(L), totInt = rows.reduce((s, r) => s + r.interest, 0);
    const M = loanPayment(L);
    h.className = "hint";
    h.textContent = (L.deferral ? `Pendant le différé : ${eur(rows[0].payment + L.insurance)}/mois, puis ` : "") + (L.steps ? `Palier : ${eur(L.steps[0].payment)} pendant ${L.steps[0].months} mois, puis ` : (L.deferral ? "" : "Mensualité calculée : ")) +
      `${eur(M)} hors assurance${L.insurance ? " (" + eur(M + L.insurance) + " avec)" : ""} · intérêts totaux ${eur(totInt)} · fin ${fmtMonth(rows[rows.length - 1].date)}. Compare avec ton tableau d'amortissement.`;
  };
  ["amount", "rate", "years", "start", "def", "ins", "p1", "p1m"].forEach(id => $(`#${pfx}-${id}`, d)?.addEventListener("input", run));
  run();
}

      if (date && isNaN(price)) { hint.className = "hint err"; hint.textContent = "Prix introuvable : saisis-le à la main."; return; }

      if (date) a.txs.push({ id: uid(), t: "buy", date, qty, price, fees: 0 });
      S.assets.push(a); save(); dlg.close(); openAsset(a.id); toast("Ajouté");
      refreshPrices();
    };
    setTimeout(() => q.focus(), 30);
  });
}

// Import additif : ajoute les éléments du fichier sans rien effacer.
// Un placement coté déjà présent (même symbole) reçoit les opérations manquantes, sans doublon.
function importAssets(list) {
  let added = 0;
  const key = x => [x.t || "", x.date, +(+x.qty || 0).toFixed(10), +(+x.value || 0).toFixed(2)].join("|");
  const idMap = {};
  for (let inc of list) {
    if (!inc || !inc.kind) continue;
    if (inc.linkedTo && idMap[inc.linkedTo]) inc = { ...inc, linkedTo: idMap[inc.linkedTo] };
    const same = S.assets.find(a => !a.demo && ((inc.id && a.id === inc.id) || (inc.kind === "cote" && a.kind === "cote" && a.symbol === inc.symbol) || (inc.kind !== "cote" && a.kind === inc.kind && a.name === inc.name)));
    if (!same) {
      const copy = { ...inc, id: !inc.id || S.assets.some(a => a.id === inc.id) ? uid() : inc.id, demo: false,
        txs: (inc.txs || []).map(t => ({ fees: 0, ...t, id: t.id || uid() })), vals: (inc.vals || []).map(v => ({ ...v, id: v.id || uid() })) };
      if (copy.kind === "cote" && !copy.currency) copy.currency = "EUR";
      S.assets.push(copy); added += Math.max(1, copy.txs.length + copy.vals.length); continue;
    }
    if (inc.id) idMap[inc.id] = same.id;
    // complète les réglages d'un bien ou d'un crédit déjà présent (achat, quote-part, crédit…)
    const orphan = x => !x.linkedTo || !S.assets.some(y => y.id === x.linkedTo);
    const fits = { cote: [], bien: ["purchase", "share", "growth", "interp"], dette: ["loan", "linkedTo", "interp"] }[same.kind] || [];
    for (const k of fits) if (inc[k] !== undefined && (same[k] === undefined || (k === "loan" && JSON.stringify(same.loan) !== JSON.stringify(inc.loan)) || (k === "linkedTo" && same.linkedTo !== inc.linkedTo && orphan(same)) || (["purchase", "share", "growth"].includes(k) && JSON.stringify(same[k]) !== JSON.stringify(inc[k])))) { same[k] = inc[k]; added++; }
    const have = new Set([...(same.txs || []), ...(same.vals || [])].map(key));
    for (const t of inc.txs || []) if (!have.has(key(t))) { same.txs.push({ fees: 0, ...t, id: uid() }); added++; }
    for (const v of inc.vals || []) if (!have.has(key(v))) { same.vals.push({ ...v, id: uid() }); added++; }
  }
  if (relinkOrphans()) added++;
  return added;
}

    const reset = $("#s-reset", d);
    reset.onclick = () => {
      if (!reset.classList.contains("armed")) { reset.classList.add("armed"); reset.textContent = "Confirmer : tout effacer"; return; }
      tomb(...S.assets.map(a => a.id)); S.assets = []; S.demo = false; save(); dlg.close(); UI.view = "home"; render(); updateBanner(); toast("Tout a été effacé");
    };
  });
}

/* ================= Navigation & rafraîchissement ================= */
function openAsset(id) {
  const a = S.assets.find(x => x.id === id);
  UI.view = "asset"; UI.assetId = id; UI.mode = a && a.kind === "bien" && linkedCredits(a).length ? "eq" : "val";
  render(); scrollTo(0, 0);
}
function needsLogin() { return !TOKEN && !UI.guest; }
// affiche toute erreur à l'écran pour pouvoir la signaler
function showError(e) {
  const msg = (e && (e.message || e.reason?.message || e.reason)) || String(e);
  let box = $("#errbox");
  if (!box) { box = document.createElement("div"); box.id = "errbox"; box.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:200;background:var(--down);color:#fff;padding:10px 14px;border-radius:10px;font:13px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:40vh;overflow:auto"; box.onclick = () => box.remove(); document.body.appendChild(box); }
  box.textContent = "Erreur (touche pour fermer) : " + msg + (e?.stack ? "\n" + String(e.stack).split("\n").slice(0, 3).join("\n") : "");
}
// ignore les erreurs des extensions du navigateur (MetaMask, etc.), qui ne viennent pas de l'appli
const fromExtension = e => /(chrome|moz|safari(-web)?)-extension:\/\//.test(String(e?.filename || "") + String(e?.error?.stack || "") + String(e?.reason?.stack || "") + String(e?.reason || ""));
addEventListener("error", e => { if (!fromExtension(e)) showError(e.error || e.message); });
addEventListener("unhandledrejection", e => { if (!fromExtension(e)) showError(e.reason); });
function openAssetSafe(id) { try { openAsset(id); } catch (e) { UI.view = "home"; showError(e); } }
function render() {
  const lock = needsLogin();
  $("#btn-add").hidden = lock;
  updateBanner();
  if (lock) return renderLogin();
  if (UI.view === "asset") renderAsset(); else renderHome();
}
function renderLogin() {
  $("#app").innerHTML = `
    <section class="form login" style="max-width:440px;margin:6vh auto 0;width:100%">
      <h2 style="font-size:24px">Connexion</h2>
      <p class="hint" style="font-size:14px;margin:0">Entre ton mot de passe pour retrouver ton patrimoine, synchronisé sur tous tes appareils.</p>
      <form id="loginform" style="display:flex;flex-direction:column;gap:12px" autocomplete="on">
        <input type="text" name="username" value="patrimoine" autocomplete="username" hidden>
        <label class="f">Mot de passe<input type="password" id="l-pass" autocomplete="current-password" required></label>
        <div class="form-actions"><span class="hint ${UI.loginMsg ? "err" : ""}" id="l-hint">${esc(UI.loginMsg || "")}</span><button class="btn primary" type="submit" id="l-btn">Se connecter</button></div>
      </form>
      <hr class="divider">
      <button class="btn ghost" type="button" id="l-demo" style="align-self:flex-start;margin-left:-10px">Voir l'appli avec des données d'exemple</button>
    </section>`;
  const f = $("#loginform"), hint = $("#l-hint"), btn = $("#l-btn");
  f.onsubmit = async e => {
    e.preventDefault();
    btn.disabled = true; hint.className = "hint"; hint.textContent = "Connexion…";
    try { UI.loginMsg = ""; await login($("#l-pass").value); toast("Connecté"); }
    catch (err) { hint.className = "hint err"; hint.textContent = err.message; btn.disabled = false; }
  };
  $("#l-demo").onclick = () => { UI.guest = true; if (!S.assets.length) { const w = S.workerUrl; S = { ...demoState(), workerUrl: w, rev: 0, deleted: [] }; persist(); } render(); };
  setTimeout(() => $("#l-pass")?.focus(), 30);
}
function updateBanner() { $("#banner").hidden = needsLogin() || !S.assets.some(a => a.demo); }
let PRICE_MSG = "", PRICE_ERR = false;
function setStatus(msg, err) { PRICE_MSG = msg || ""; PRICE_ERR = !!err; paintStatus(); }
function paintStatus() {
  const s = $("#status");
  const parts = [SYNC_MSG, PRICE_MSG].filter(Boolean);
  const msg = needsLogin() ? "" : parts.join(" · ");
  s.textContent = msg; s.title = msg;
  s.className = "status" + (SYNC_ERR || PRICE_ERR ? " err" : "");
}

let refreshing = false;
async function refreshPrices(force = false) {
  if (refreshing) return; refreshing = true;
  const list = S.assets.filter(a => a.kind === "cote" && a.symbol && !a.symbol.startsWith("EX:") && a.txs.length);
  if (!list.length) { refreshing = false; setStatus(""); return; }
  if (!S.workerUrl) { refreshing = false; setStatus("Relais de prix à configurer", true); return; }
  setStatus("Mise à jour des cours…");
  const errs = [];
  let changed = false;
  await Promise.all(list.map(async a => {
    try { const s = await ensure(a.symbol, firstDate(a), force); if (s && s.cur && a.currency !== s.cur) { a.currency = s.cur; changed = true; } }
    catch (e) { errs.push(a.symbol); }
  }));
  if (changed) save(); else CALC = null;
  refreshing = false;
  CALC = null; render();
  if (errs.length) setStatus("Cours indisponibles : " + errs.join(", "), true);
  else setStatus("Cours à jour · " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
}

$("#btn-add").onclick = () => openAdd();
$("#btn-settings").onclick = () => openSettings();
$("#brand").onclick = () => { UI.view = "home"; render(); scrollTo(0, 0); };
$("#brand").onkeydown = e => { if (e.key === "Enter") $("#brand").click(); };
$("#btn-clear-demo").onclick = () => { tomb(...S.assets.filter(a => a.demo).map(a => a.id)); S.assets = S.assets.filter(a => !a.demo); S.demo = false; save(); UI.view = "home"; render(); updateBanner(); toast("Exemples effacés"); };
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { sync(); refreshPrices(); } });
addEventListener("online", () => sync());

load();
render();
refreshPrices();
sync();
</script>
</body>
</html>
